name: Application Build & Release

permissions:
  contents: write
  pull-requests: read

on:
  push:
    branches: ['main']
    paths:
      - 'src/main/**'
      - 'src/renderer/**'
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          npm_config_python: "C:\\Python39\\python.exe"
          npm_config_msvs_version: '2022'
          GYP_DEFINES: "windows_sdk_version='10.0.19041.0'"
          WindowsSDKVersion: '10.0.19041.0'
          npm_config_target_arch: 'x64'
          npm_config_build_from_source: 'true'

      - name: Build application
        run: pnpm run build:electron

      - name: List build output
        run: Get-ChildItem -Recurse release/
        shell: pwsh

      - name: Check if tag exists
        id: check_tag
        shell: bash
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "TAG=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Generate checksums
        if: steps.check_tag.outputs.exists == 'false'
        shell: pwsh
        run: |
          Get-ChildItem release/${{ steps.check_tag.outputs.TAG }} -File | Get-FileHash -Algorithm SHA256 | Out-File -Encoding utf8 release/SHA256SUMS.txt

      - name: Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_tag.outputs.TAG }}
          name: Release ${{ steps.check_tag.outputs.TAG }}
          body: 'Auto-generated release from CI'
          draft: false
          prerelease: false
          files: |
            release/${{ steps.check_tag.outputs.TAG }}/*.exe
            release/${{ steps.check_tag.outputs.TAG }}/*.zip
            release/${{ steps.check_tag.outputs.TAG }}/*.exe.blockmap
            release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
