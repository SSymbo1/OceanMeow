name: Release Application

on:
  push:
    branches: ['main']
    paths:
      - 'src/main/**'
      - 'src/renderer/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Add MSVC build tools
        uses: microsoft/setup-msbuild@v2

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build:electron

      - name: Generate tag
        id: tag
        shell: bash
        run: |
          TAG="v$(node -p require('./package.json').version)"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, aborting release."
            exit 1
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem release/${{ steps.tag.outputs.TAG }} -File | Get-FileHash -Algorithm SHA256 | Out-File -Encoding utf8 release/SHA256SUMS.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: Release ${{ steps.tag.outputs.TAG }}
          body: 'Auto-generated release from CI'
          draft: false
          prerelease: false
          files: |
            release/${{ steps.tag.outputs.TAG }}/*.exe
            release/${{ steps.tag.outputs.TAG }}/*.zip
            release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
