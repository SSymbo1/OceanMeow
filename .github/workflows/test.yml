name: Appplication Test

on:
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Configure Python and Win10 SDK for node-gyp
        run: |
          npm config set python python3
          npm config set msvs_version 2022
          npm config set sdk_version 10.0.19041.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize project
        run: pnpm run project:init

      - name: Run lint
        run: pnpm run lint

      - name: Run compile
        run: pnpm tsc --noEmit

      - name: Run tests
        run: pnpm run test
