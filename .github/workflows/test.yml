name: Appplication Test

on:
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          npm_config_python: "C:\\Python39\\python.exe"
          npm_config_msvs_version: '2022'
          GYP_DEFINES: "windows_sdk_version='10.0.19041.0'"
          WindowsSDKVersion: '10.0.19041.0'
          npm_config_target_arch: 'x64'
          npm_config_build_from_source: 'true'

      - name: Initialize project
        run: pnpm run project:init

      - name: Run lint
        run: pnpm run lint

      - name: Run TypeScript compile
        run: pnpm tsc --noEmit

      - name: Run Vue-TypeScript compile
        run: pnpm vue-tsc --noEmit

      - name: Run tests
        run: pnpm run test
